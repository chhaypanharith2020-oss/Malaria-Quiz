<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Quiz App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 font-sans flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-lg shadow-md border border-slate-200 w-full max-w-4xl p-6">
        <!-- Top Stats Header -->
        <div class="flex justify-between items-center border-b pb-4 mb-6 text-sm text-slate-600 font-medium">
            <div>📋 Question List</div>
            <div class="flex gap-6">
                <span>Question <strong id="current-index">1</strong> of <strong id="total-questions">0</strong></span>
                <span>Your Score: <strong id="score-display">0</strong></span>
            </div>
        </div>

        <!-- Question Prompt -->
        <div class="mb-6">
            <p id="question-text" class="text-lg text-slate-800 font-medium leading-relaxed">Loading question...</p>
        </div>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3 mb-6">
            <!-- Dynamic options loaded by JS -->
        </div>

        <!-- Correct/Incorrect Feedback Card -->
        <div id="feedback-card" class="hidden rounded-lg p-4 mb-6 border">
            <p id="feedback-title" class="font-bold text-lg mb-1"></p>
            <p id="feedback-text" class="text-sm text-slate-700"></p>
        </div>

        <!-- Bottom Navigation Buttons -->
        <div class="flex justify-between items-center border-t pt-4">
            <button id="close-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded transition">Close Review</button>
            <div class="flex gap-2">
                <button id="prev-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded transition disabled:opacity-50">⟨ Prev</button>
                <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded transition">Next ⟩</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
